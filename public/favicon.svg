<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Rounded Geometric Container -->
  <rect
    x="6"
    y="6"
    width="108"
    height="108"
    rx="28"
    fill="#121215"
    stroke="#ff5722"
    stroke-width="2.5"
  />

  <!-- Inner Contrast Chamber -->
  <rect
    x="12"
    y="12"
    width="96"
    height="96"
    rx="22"
    fill="#0d0d0f"
  />

  <!-- ULTRA-STYLISH INTERLOCKING "SP" MONOGRAM -->
  <g id="sp-brand-mark">
    <!-- "S" Geometric Ribbon (Electric Orange #ff5722) -->
